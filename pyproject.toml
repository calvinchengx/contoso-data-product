[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contoso-data-product"
version = "0.1.1"
description = "Portable Contoso data product: bronze/silver Spark logic, gold dbt SQL, ODCS contracts. Consumers wrap it; they do not restate it."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
compare = ["requests>=2.32"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# BOTH dbt projects ship in the wheel. A consumer resolves them with
# `gold_dir()` / `silver_dir()` and points dbt there; a model that failed to
# package would surface as a dbt compilation error in a consumer's CI, naming
# a path rather than the omission that caused it.
contoso_product = ["py.typed", "gold/**/*", "silver/**/*"]

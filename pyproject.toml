[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contoso-data-product"
version = "0.4.1"
description = "Portable Contoso data product: bronze/silver Spark logic, gold dbt SQL, ODCS contracts. Consumers wrap it; they do not restate it."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
compare = ["requests>=2.32"]

[dependency-groups]
dev = ["pytest>=9.0.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# BOTH dbt projects ship in the wheel. A consumer resolves them with
# `gold_dir()` / `silver_dir()` and points dbt there; a model that failed to
# package would surface as a dbt compilation error in a consumer's CI, naming
# a path rather than the omission that caused it.
contoso_product = ["py.typed", "gold/**/*", "silver/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ty.rules]
# Unresolved by CONSTRUCTION, not by mistake. The Spark imports are
# function-local and pyspark is deliberately NOT a dependency of this package:
# the engine provides the session, and this product runs on three of them.
# Declaring pyspark to satisfy a checker would pin a Spark version into a
# package whose whole claim is that it does not choose one.
unresolved-import = "ignore"

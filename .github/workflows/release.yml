# Publish the data product as a wheel, so consumers install a RELEASE rather
# than a checkout beside them.
#
# Both consumers used to resolve this package through `../contoso-data-product`
# in `[tool.uv.sources]`, which meant neither could be cloned on its own and
# neither was really proving what it claimed: that a consumer builds against
# something everyone else can get.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    name: contoso-data-product wheel → the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.3"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Builds, installs the artifact into a throwaway venv and asserts the
      # gold project survived packaging. A wheel that imports but ships no
      # models fails a consumer later, at `dbt run`, a long way from here.
      - name: Build and prove the wheel
        run: python3 scripts/build_wheel.py
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Attach the wheel to the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          gh release upload "$tag" dist/*.whl --clobber

  bump-leaves:
    name: Open the pin bump on every leaf
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # AFTER the wheel is attached, not beside it. A leaf's bump PR points at a
      # release asset, so opening it while the asset is still uploading tells
      # seven repositories to resolve a URL that is not there yet. fabric-emulator
      # learned this the expensive way: its dispatch beat the image it announced
      # by 7m46s.
      - name: Bump every leaf
        env:
          # Needs `contents: write` and `pull_requests: write` on the seven leaf
          # repositories. THIS WAS ONCE THE ONLY MECHANISM, and the step failed
          # loudly without it on purpose -- a release that told nobody had to be
          # visible. That is no longer true: `docs/leaf-bump-workflow.yml` has
          # been deployed to all seven leaves since 2026-08-20 (the same day
          # this job was written), each raising its own bump on its own
          # schedule from its own GITHUB_TOKEN. Verified 2026-09-19: all seven
          # already pin this release with no PR pending, entirely from that
          # backstop, while this token has never existed. A step that can only
          # ever fail is not a live check any more; it is a permanently red
          # light nobody looks at, which is worse than no light -- so a missing
          # token now WARNS rather than fails the release. It stays worth
          # creating: it is the one thing that gets a leaf bumped within
          # minutes instead of within a day.
          GH_TOKEN: ${{ secrets.LEAF_BUMP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::LEAF_BUMP_TOKEN is not set, so this release was not " \
                 "pushed to any leaf directly. Each leaf's own scheduled " \
                 "product-bump.yml will pick it up on its own -- normally within " \
                 "a day -- so this is a delay, not a gap. Set the token for an " \
                 "immediate bump instead."
            exit 0
          fi
          python3 scripts/bump_leaves.py
